[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "risedual-alpha-core"
version = "0.1.0"
requires-python = ">=3.11"
description = "Independent event-driven Alpha execution core"
[project.optional-dependencies]
patterns = ["pandas>=2.2,<3", "pydantic>=2,<3"]
[tool.setuptools.packages.find]
include = ["alpha*"]
